let currentIndex = 0;
let isPlaying = true;
let intervalId = null;
let speed = 600;

const img = document.getElementById('screenImg');
const overlay = document.getElementById('stepOverlay');
const scrubber = document.getElementById('scrubber');
const counter = document.getElementById('counter');
const playBtn = document.getElementById('playBtn');
const speedBtn = document.getElementById('speedBtn');

function showFrame(idx) {
  if (idx < 0) idx = 0;
  if (idx >= frameList.length) idx = frameList.length - 1;
  currentIndex = idx;
  const frame = frameList[idx];
  img.src = frame.data;
  overlay.innerText = (idx + 1) + '. ' + frame.label;
  scrubber.value = idx;
  counter.innerText = (idx + 1) + ' / ' + frameList.length;
}

function togglePlay() {
  if (isPlaying) {
    clearInterval(intervalId);
    isPlaying = false;
    playBtn.innerText = '▶ Play';
  } else {
    if (currentIndex >= frameList.length - 1) currentIndex = 0;
    startLoop();
    isPlaying = true;
    playBtn.innerText = '⏸ Pause';
  }
}

function startLoop() {
  clearInterval(intervalId);
  intervalId = setInterval(() => {
    if (currentIndex < frameList.length - 1) {
      showFrame(currentIndex + 1);
    } else {
      clearInterval(intervalId);
      isPlaying = false;
      playBtn.innerText = '↺ Replay';
    }
  }, speed);
}

function seekTo(val) {
  showFrame(parseInt(val));
}

function step(delta) {
  if (isPlaying) togglePlay();
  showFrame(currentIndex + delta);
}

function toggleSpeed() {
  if (speed === 600) { speed = 300; speedBtn.innerText = '2x'; }
  else if (speed === 300) { speed = 1200; speedBtn.innerText = '0.5x'; }
  else { speed = 600; speedBtn.innerText = '1x'; }
  if (isPlaying) startLoop();
}

if (frameList.length > 0) {
  showFrame(0);
  startLoop();
}
</script>
