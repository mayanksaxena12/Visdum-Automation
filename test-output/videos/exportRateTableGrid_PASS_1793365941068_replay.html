<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>Video Replay - exportRateTableGrid</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #1e293b; padding: 12px 18px; border-radius: 8px; }
.title { font-size: 16px; font-weight: 700; }
.badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
.badge-pass { background: #10b981; color: #fff; }
.badge-fail { background: #ef4444; color: #fff; }
.badge-skip { background: #f59e0b; color: #fff; }
.player-box { max-width: 1200px; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
.screen-container { position: relative; width: 100%; height: 600px; display: flex; align-items: center; justify-content: center; background: #090d16; }
.screen-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
.step-overlay { position: absolute; bottom: 12px; left: 16px; background: rgba(15,23,42,0.85); backdrop-filter: blur(4px); padding: 8px 16px; border-radius: 6px; font-size: 13px; color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }
.controls { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #1e293b; }
.btn { background: #3b82f6; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s; }
.btn:hover { background: #2563eb; }
.btn-secondary { background: #334155; }
.btn-secondary:hover { background: #475569; }
.scrubber { flex: 1; accent-color: #3b82f6; cursor: pointer; }
.counter { font-size: 12px; color: #94a3b8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class='player-box'>

    </div>
    <span class='badge badge-pass'>PASS</span>
  </div>
  <div class='screen-container'>
    <img id='screenImg' src='' alt='Screen Frame' />
    <div id='stepOverlay' class='step-overlay'>Step 1</div>
  </div>
  <div class='controls'>
    <button id='playBtn' class='btn' onclick='togglePlay()'>⏸ Pause</button>
    <button class='btn btn-secondary' onclick='step(-1)' title='Previous Frame'>⏮</button>

    <input type='range' id='scrubber' class='scrubber' min='0' max='2' value='0' oninput='seekTo(this.value)' />
    <span id='counter' class='counter'>1 / 3</span>
    <button id='speedBtn' class='btn btn-secondary' onclick='toggleSpeed()'>1x</button>
  </div>
</div>

let currentIndex = 0;
let isPlaying = true;
let intervalId = null;
let speed = 600;

const img = document.getElementById('screenImg');
const overlay = document.getElementById('stepOverlay');
const scrubber = document.getElementById('scrubber');
const counter = document.getElementById('counter');
const playBtn = document.getElementById('playBtn');
const speedBtn = document.getElementById('speedBtn');

function showFrame(idx) {
  if (idx < 0) idx = 0;
  if (idx >= frameList.length) idx = frameList.length - 1;
  currentIndex = idx;
  const frame = frameList[idx];
  img.src = frame.data;
  overlay.innerText = (idx + 1) + '. ' + frame.label;
  scrubber.value = idx;
  counter.innerText = (idx + 1) + ' / ' + frameList.length;
}

function togglePlay() {
  if (isPlaying) {
    clearInterval(intervalId);
    isPlaying = false;
    playBtn.innerText = '▶ Play';
  } else {
    if (currentIndex >= frameList.length - 1) currentIndex = 0;
    startLoop();
    isPlaying = true;
    playBtn.innerText = '⏸ Pause';
  }
}

function startLoop() {
  clearInterval(intervalId);
  intervalId = setInterval(() => {
    if (currentIndex < frameList.length - 1) {
      showFrame(currentIndex + 1);
    } else {
      clearInterval(intervalId);
      isPlaying = false;
      playBtn.innerText = '↺ Replay';
    }
  }, speed);
}

function seekTo(val) {
  showFrame(parseInt(val));
}

function step(delta) {
  if (isPlaying) togglePlay();
  showFrame(currentIndex + delta);
}

function toggleSpeed() {
  if (speed === 600) { speed = 300; speedBtn.innerText = '2x'; }
  else if (speed === 300) { speed = 1200; speedBtn.innerText = '0.5x'; }
  else { speed = 600; speedBtn.innerText = '1x'; }
  if (isPlaying) startLoop();
}

if (frameList.length > 0) {
  showFrame(0);
  startLoop();
}
</script>
